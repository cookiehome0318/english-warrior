<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>英文小勇士 - 句子練習</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background: #fff8e7;
            text-align: center;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        h1 {
            color: #ff8c42;
        }

        /* 詞性提示 */
        #partOfSpeech {
            display: inline-block;
            background: #e8f4ff;
            color: #2878b5;
            font-size: 20px;
            font-weight: bold;
            padding: 10px 22px;
            border-radius: 15px;
            margin: 10px 0 5px;
        }

        #sentence {
            font-size: 30px;
            font-weight: bold;
            margin: 30px 0 20px;
            line-height: 1.5;
        }

        #sentenceChinese {
            font-size: 22px;
            color: #666;
            margin-bottom: 25px;
        }

        button {
            border: none;
            border-radius: 12px;
            padding: 12px 20px;
            margin: 8px;
            font-size: 18px;
            cursor: pointer;
        }

        button:disabled {
            opacity: 0.6;
            cursor: default;
        }

        #speakBtn {
            background: #ffd166;
        }

        #nextBtn {
            background: #06d6a0;
            color: white;
        }

        #backBtn {
            background: #ddd;
        }

        #choices {
            margin: 15px 0;
        }

        #choices button {
            background: #f1f1f1;
            min-width: 100px;
        }

        #choices button:hover {
            background: #ffe082;
        }

        #message {
            font-size: 22px;
            margin: 20px 0;
            min-height: 30px;
        }

    </style>

</head>

<body>

<div class="container">

    <h1>📝 句子練習</h1>

    <!-- 詞性提示 -->
    <div id="partOfSpeech">
        請找出詞性
    </div>

    <!-- 英文句子 -->
    <div id="sentence">
        載入中...
    </div>

    <!-- 中文翻譯 -->
    <div id="sentenceChinese">
    </div>

    <!-- 聽句子 -->
    <button id="speakBtn" onclick="speakSentence()">
        🔊 聽句子
    </button>

    <!-- 答案 -->
    <div id="choices"></div>

    <!-- 答對 / 答錯 -->
    <div id="message"></div>

    <!-- 下一題 -->
    <button id="nextBtn" onclick="nextSentence()">
        ➡️ 下一題
    </button>

    <br>

    <!-- 回首頁 -->
    <button id="backBtn" onclick="location.href='index.html'">
        🏠 回首頁
    </button>

</div>

<script src="words.js"></script>
<script src="sentence.js"></script>

</body>

</html>
