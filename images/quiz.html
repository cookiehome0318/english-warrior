
<!DOCTYPE html>
<html lang="zh-TW">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>📝 小測驗</title>

<link rel="stylesheet"
href="style.css">

</head>

<body>

<header>

<h1>📝 英文小測驗</h1>

</header>

<div class="container">

<h2>

⭐ 分數：
<span id="score">0</span>

</h2>

<h2>
🪙 金幣：
<span id="coins">0</span>
</h2>
<h2>
⭐ Lv.
<span id="level">1</span>

（EXP：
<span id="exp">0</span>/100）
</h2>
<h2>

❤️
<span id="life">3</span>

</h2>

<h2>

⏰
<span id="timer">20</span>

</h2>

<h2>

🏆
<span id="highScore">0</span>

<h2 id="combo">
🔥 Combo x0
</h2>

<h2 id="achievement">
🏅 尚未獲得成就
</h2>

<div id="achievementPopup"></div>

</h2>

<h2 id="questionType">

</h2>

<img
id="quizImage"
width="220">

<h2 id="question"></h2>

<div id="choices"></div>

<h2 id="message"></h2>

<button
id="playButton"
style="display:none;"
onclick="playWord()">

🔊 播放

</button>

<br><br>

<button
onclick="location.href='index.html'">

🏠 回首頁

</button>

</div>

<script src="words.js"></script>
<script src="quiz.js"></script>

</body>

</html>
