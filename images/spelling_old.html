
<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>拼字挑戰</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>✏️ 拼字挑戰</h1>
</header>

<div class="container">

    <h2>
        ⭐ 分數：<span id="score">0</span>
    </h2>
<h2>
🪙 金幣：
<span id="coins">0</span>
</h2>

<h2>
⭐ Lv.
<span id="level">1</span>

<h2>📅 今日任務</h2>

<div id="dailyMission">

<div>
☐ 拼字答對 20 題
</div>

<div>
☐ 達成 Combo x10
</div>

<div>
☐ 擊敗 Boss 1 次
</div>

</div>

<br>

<button id="claimReward"
style="display:none;"
onclick="claimDailyReward()">

🎁 領取寶箱

</button>


（EXP：
<span id="exp">0</span>/100）
</h2>

<h2>
❤️ <span id="life">3</span>
</h2>

<h2>
⏰ <span id="timer">30</span>
</h2>
    <h2>
        🏆 最高分：<span id="highScore">0</span>
    </h2>

    <h2 id="combo">
🔥 Combo x0
</h2>

    <h2 id="achievement">
🏅 尚未獲得成就
</h2>
<div id="achievementPopup"></div>

    <img id="wordImage" src="" width="250">

    <h2>請拼出圖片的英文</h2>

    <h1 id="answer">_ _ _</h1>
    <h2 id="message"></h2>
    <div id="starAnimation"></div>

    <div id="letters"></div>

    <br>
<button onclick="speakWord()">
    🔊 再播放一次
</button>
    <button onclick="clearAnswer()">
        🗑️ 清除
    </button>

    <br><br>

    <button onclick="location.href='index.html'">
        🏠 回首頁
    </button>

</div>

<script src="words.js"></script>
<script src="spelling.js"></script>

</body>

</html>
