<!DOCTYPE html>
<html lang="zh-TW">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>✏️ 英文小勇士－拼字挑戰</title>

<link
rel="stylesheet"
href="style.css">

</head>

<body>

<h1>

✏️ 英文小勇士

<br>

拼字挑戰 Ultimate

</h1>

<div class="topBar">

<div>

❤️
<span id="life">3</span>

</div>

<div>

⭐
<span id="score">0</span>

</div>

<div>

🪙
<span id="coins">0</span>

</div>

<div>

🔥
<span id="combo">0</span>

</div>

</div>

<div class="topBar">

<div>

⭐ Lv.

<span id="level">

1

</span>

</div>

<div>

EXP

<span id="exp">

0

</span>

/100

</div>

<div>

⏰

<span id="timer">

30

</span>

</div>

</div>

<h2 id="achievement">

🏅 尚未獲得成就

</h2>

<img

id="wordImage"

src=""

alt="圖片"

>

<br>

<button

id="playButton"

onclick="speakWord()">

🔊 再播放一次

</button>

<button onclick="goHome()">
🏠 回首頁
</button>

<h1 id="answer">

_ _ _

</h1>

<div id="letters">

</div>

<br>

<button

onclick="clearAnswer()">

🗑️ 清除

</button>

<button onclick="undoLetter()">
↩️ 返回一個字母
</button>


<button onclick="hint()">
💡 免費提示
</button>

<h2 id="message">

</h2>

<div id="starAnimation">

</div>

<div id="achievementPopup">

</div>

<script src="words.js"></script>

<script src="spelling.js"></script>

</body>

</html>
