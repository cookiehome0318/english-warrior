<!DOCTYPE html>
<html lang="zh-TW">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>句子錯題再練習</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background: #fff8e7;
            text-align: center;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        h1 {
            color: #ff8c42;
        }

        #sentence {
            font-size: 30px;
            font-weight: bold;
            margin: 35px 0 20px;
            line-height: 1.5;
        }

        #sentenceChinese {
            font-size: 22px;
            color: #666;
            margin-bottom: 25px;
        }

        #choices button {
            min-width: 120px;
            background: #f1f1f1;
        }

        button {
            border: none;
            border-radius: 12px;
            padding: 12px 20px;
            margin: 8px;
            font-size: 18px;
            cursor: pointer;
        }

        #speakBtn {
            background: #ffd166;
        }

        #backBtn {
            background: #ddd;
        }

        #message {
            font-size: 22px;
            margin: 20px 0;
            min-height: 30px;
        }

        #emptyMessage {
            font-size: 24px;
            color: #06a77d;
            margin: 40px 0;
        }

    </style>

</head>

<body>

<div class="container">

    <h1>📚 句子錯題再練習</h1>

    <div id="sentence"></div>

    <div id="sentenceChinese"></div>

    <button id="speakBtn"
            onclick="speakSentence()">
        🔊 聽句子
    </button>

    <div id="choices"></div>

    <div id="message"></div>

    <div id="emptyMessage"></div>

    <button id="backBtn"
            onclick="location.href='index.html'">
        🏠 回首頁
    </button>

</div>

<script src="sentence-review.js"></script>

</body>

</html>
